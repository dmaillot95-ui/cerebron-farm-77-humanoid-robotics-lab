name: f77-multibody-humanoid\non:\n  workflow_dispatch:\n  push:\n    paths:\n      - 'simulation/f77_multibody_humanoid.py'\n      - '.github/workflows/f77-multibody-humanoid-canary.yml'\npermissions:\n  contents: read\njobs:\n  simulate:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Run second-generation simulation\n        run: python simulation/f77_multibody_humanoid.py\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: f77-multibody-humanoid\n          path: out/*.json\n          retention-days: 14\n