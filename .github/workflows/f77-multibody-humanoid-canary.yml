name: F77 multibody humanoid V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'simulation/f77_multibody_humanoid.py'
      - '.github/workflows/f77-multibody-humanoid-canary.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run second-generation simulation
        run: python simulation/f77_multibody_humanoid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f77-multibody-humanoid
          path: out/*.json
          retention-days: 14
